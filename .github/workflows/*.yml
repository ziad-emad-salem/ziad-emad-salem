name: My First Workflow

# إمتى الكود ده يشتغل؟ (هنا هيشتغل مع كل Push على برانش main)
on:
  push:
    branches: [ "main" ]

# الصلاحيات اللي الـ Token محتاجها (مثلاً قراءة وكتابة)
permissions:
  contents: write
  issues: write

jobs:
  run-gh-command:
    runs-on: ubuntu-latest # السيرفر اللي هينفذ الأوامر
    steps:
      # 1. تحميل ملفات الـ Repo على السيرفر
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. استخدام GH_TOKEN لتنفيذ أمر
      - name: Test GH CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list
